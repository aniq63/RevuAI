name: RevuAI CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/revuai


jobs:

  # ============================================================
  # 1. RUN TESTS
  # ============================================================

  test:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Run pytest
      # --------------------------------------------------------

      - name: Run tests
        run: |
          pytest


  # ============================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build-and-push:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Build and push Docker image
      # --------------------------------------------------------

      - name: Build and push Docker image
        id: build

        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/revuai
          SHA_TAG: sha-${{ github.sha }}

        run: |

          echo "======================================"
          echo "Docker Build Information"
          echo "======================================"

          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Image:"
          echo "$IMAGE"

          echo ""
          echo "SHA:"
          echo "${{ github.sha }}"

          echo ""
          echo "SHA Tag:"
          echo "$SHA_TAG"

          echo ""
          echo "Full SHA Image:"
          echo "$IMAGE:$SHA_TAG"

          echo ""
          echo "======================================"
          echo "Building Docker image..."
          echo "======================================"


          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --tag "$IMAGE:$SHA_TAG" \
            --tag "$IMAGE:latest" \
            --push \
            .


          echo ""
          echo "======================================"
          echo "Docker image pushed successfully"
          echo "======================================"


          echo ""
          echo "Pushed images:"

          echo "$IMAGE:$SHA_TAG"
          echo "$IMAGE:latest"


          # Pass the exact image name to the deploy job.
          echo "image=$IMAGE:$SHA_TAG" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 3. DEPLOY TO EC2
  # ============================================================

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}

        run: |

          # Use the full GITHUB_SHA to match what was pushed to GHCR
          IMAGE="ghcr.io/${{ github.repository_owner }}/revuai:sha-${GITHUB_SHA}"

          echo "======================================"
          echo "RevuAI Deployment"
          echo "======================================"

          echo "Git SHA:"
          echo "$GITHUB_SHA"

          echo ""
          echo "Docker Image:"
          echo "$IMAGE"

          echo "======================================"


          # ==================================================
          # Setup SSH
          # ==================================================

          echo ""
          echo "Setting up SSH..."

          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


          # ==================================================
          # Connect to EC2
          # ==================================================

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE='$IMAGE' GHCR_PAT='$GHCR_PAT' REPO_OWNER='$REPO_OWNER' bash -s" << 'REMOTE_SCRIPT'


            set -e


            echo ""
            echo "======================================"
            echo "Starting RevuAI deployment"
            echo "======================================"

            echo "Image:"
            echo "$IMAGE"

            echo "======================================"


            # ==================================================
            # Login to GHCR from EC2
            # ==================================================

            echo ""
            echo "Logging into GitHub Container Registry..."
            echo "$GHCR_PAT" | docker login ghcr.io -u "$REPO_OWNER" --password-stdin


            # ==================================================
            # Pull new image
            # ==================================================

            echo ""
            echo "Pulling new Docker image..."

            docker pull "$IMAGE"


            echo ""
            echo "Docker image pulled successfully."


            # ==================================================
            # Stop old container
            # ==================================================

            echo ""
            echo "Stopping old container..."

            docker stop revuai-backend || true


            # ==================================================
            # Remove old container
            # ==================================================

            echo ""
            echo "Removing old container..."

            docker rm revuai-backend || true


            # ==================================================
            # Start new container
            # ==================================================

            echo ""
            echo "Starting new container..."

            docker run -d \
              --name revuai-backend \
              --restart unless-stopped \
              --env-file ~/revuai/.env \
              -e NUMBA_CACHE_DIR=/tmp \
              -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlruns.db \
              -e HF_HOME=/tmp \
              -p 8000:8000 \
              "$IMAGE"


            # ==================================================
            # Wait for application
            # ==================================================

            echo ""
            echo "Waiting for application..."

            HEALTHY=false

            for i in {1..30}; do

              if curl -fs http://localhost:8000/health > /tmp/health.json; then

                echo ""
                echo "Health check passed!"

                cat /tmp/health.json

                HEALTHY=true

                break

              fi

              echo "Waiting... ($i/30)"

              sleep 5

            done


            # ==================================================
            # Verify deployment
            # ==================================================

            if [ "$HEALTHY" != "true" ]; then

              echo ""
              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "======================================"

              echo ""
              echo "Container status:"

              docker ps -a \
                --filter "name=revuai-backend"


              echo ""
              echo "Container logs:"

              docker logs --tail 100 revuai-backend


              exit 1

            fi


            # ==================================================
            # Final health check
            # ==================================================

            echo ""
            echo "Running final health check..."

            curl -fs http://localhost:8000/health


            # ==================================================
            # Show container
            # ==================================================

            echo ""
            echo "Running container:"

            docker ps \
              --filter "name=revuai-backend"


            # ==================================================
            # Success
            # ==================================================

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            echo ""
            echo "RevuAI is now running."

          REMOTE_SCRIPT