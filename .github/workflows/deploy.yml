name: RevuAI CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# Global environment
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/revuai


jobs:

  # ============================================================
  # 1. TEST
  # ============================================================

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run tests
        run: |
          pytest


  # ============================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build-and-push:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Generate Docker image tags
      # --------------------------------------------------------

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest


      # --------------------------------------------------------
      # Build and push image
      # --------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # --------------------------------------------------------
      # Save exact SHA image name for deployment
      # --------------------------------------------------------

      - name: Set image output
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/revuai:sha-${{ github.sha }}"

          echo "Docker image:"
          echo "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 3. DEPLOY TO EC2
  # ============================================================

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

          IMAGE: ${{ needs.build-and-push.outputs.image }}

        run: |

          # ==================================================
          # Setup SSH
          # ==================================================

          echo "Setting up SSH..."

          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


          # ==================================================
          # Connect to EC2
          # ==================================================

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE='$IMAGE' bash -s" << 'REMOTE_SCRIPT'


            set -e


            echo "======================================"
            echo "Starting RevuAI deployment"
            echo "======================================"

            echo "Image:"
            echo "$IMAGE"

            echo "======================================"


            # ==================================================
            # Pull new Docker image
            # ==================================================

            echo ""
            echo "Pulling new Docker image..."

            docker pull "$IMAGE"


            # ==================================================
            # Stop old container
            # ==================================================

            echo ""
            echo "Stopping old container..."

            docker stop revuai-backend || true


            # ==================================================
            # Remove old container
            # ==================================================

            echo ""
            echo "Removing old container..."

            docker rm revuai-backend || true


            # ==================================================
            # Start new container
            # ==================================================

            echo ""
            echo "Starting new container..."

            docker run -d \
              --name revuai-backend \
              --restart unless-stopped \
              --env-file ~/revuai/.env \
              -p 8000:8000 \
              "$IMAGE"


            # ==================================================
            # Wait for application to become healthy
            # ==================================================

            echo ""
            echo "Waiting for application..."

            HEALTHY=false

            for i in {1..30}; do

              if curl -fs http://localhost:8000/health > /tmp/health.json; then

                echo ""
                echo "Health check passed!"

                cat /tmp/health.json

                HEALTHY=true

                break

              fi

              echo "Waiting... ($i/30)"

              sleep 5

            done


            # ==================================================
            # Verify deployment
            # ==================================================

            if [ "$HEALTHY" != "true" ]; then

              echo ""
              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "======================================"

              echo ""
              echo "Container status:"

              docker ps -a --filter "name=revuai-backend"


              echo ""
              echo "Container logs:"

              docker logs --tail 100 revuai-backend


              exit 1

            fi


            # ==================================================
            # Show running container
            # ==================================================

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            docker ps --filter "name=revuai-backend"


            echo ""
            echo "Health endpoint:"

            curl http://localhost:8000/health


            # ==================================================
            # Cleanup unused images
            # ==================================================

            echo ""
            echo "Cleaning unused Docker images..."

            docker image prune -af


            echo ""
            echo "======================================"
            echo "RevuAI deployment completed!"
            echo "======================================"


          REMOTE_SCRIPT